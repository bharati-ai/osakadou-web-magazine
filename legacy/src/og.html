<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Noto+Serif+JP:wght@600;900&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F7F7F4;color:#1C2433}
.og{display:grid;grid-template-columns:400px 150px 1fr;height:630px}
.ph{background:url("https://images.unsplash.com/photo-1772249491195-e95a8a5ed845?auto=format&fit=crop&q=80&w=800&h=1260&crop=focalpoint&fp-y=0.72") center/cover}
.tate{writing-mode:vertical-rl;font-family:"Noto Serif JP",serif;font-weight:900;font-size:33px;line-height:1.55;letter-spacing:.1em;margin:0;padding:56px 0 0;justify-self:center}
.tate span{color:#B8391F}
.r{position:relative;padding:56px 70px 50px 10px}
.mast{font-family:"Bodoni Moda",serif;font-weight:700;font-size:84px;line-height:.86;letter-spacing:-.01em;margin:0;white-space:nowrap}
.rule{border-top:3px solid #1C2433;margin:16px 0 18px}
.deck{font-family:"Noto Serif JP",serif;font-weight:600;font-size:24px;line-height:1.6;letter-spacing:.1em;margin:0}
.issue{position:absolute;left:10px;bottom:84px;font-family:"Noto Serif JP",serif;font-weight:600;font-size:22px;letter-spacing:.12em;margin:0}
.issue b{display:block;font-family:"Bodoni Moda",serif;font-size:40px;color:#B8391F;letter-spacing:.02em;margin-top:6px}
.url{position:absolute;left:10px;bottom:46px;font-family:"Bodoni Moda",serif;font-size:18px;letter-spacing:.08em;color:#4A5263;margin:0}
</style></head>
<body><div class="og">
<div class="ph"></div>
<p class="tate">大阪の暮らし・健康・美容を、<br><span>もっと身近に。</span></p>
<div class="r">
<p class="mast">OSAKA LIVE</p>
<div class="rule"></div>
<p class="deck"><span style="color:#B8391F">大阪で、暮らす。</span><br>住む人の目線で、<br>出典を明記して書く<br>Webマガジン。</p>
<p class="issue">創刊準備号<b>Autumn 2026</b></p>
<p class="url">osakadou.live</p>
</div></div></body></html>
